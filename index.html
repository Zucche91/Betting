<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7">
<title>Bet Tracker</title>
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--sub:#8e8e93;--line:#e5e5ea;
  --blue:#007aff;--green:#34c759;--red:#ff3b30;--orange:#ff9500;--fill:#e9e9ee;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000;--card:#1c1c1e;--text:#fff;--sub:#8e8e93;--line:#38383a;--fill:#2c2c2e;--blue:#0a84ff;--green:#30d158;--red:#ff453a;--orange:#ff9f0a}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);padding:calc(12px + env(safe-area-inset-top)) 0 10px}
h1{font-size:32px;font-weight:700;letter-spacing:-.5px;margin:4px 0 12px}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px}
.seg button{flex:1;border:0;background:transparent;color:var(--text);padding:7px 4px;font-family:inherit;font-size:13px;font-weight:600;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.card{background:var(--card);border-radius:14px;padding:16px;margin:16px 0}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--sub);margin:0 0 12px;font-weight:600}
label{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
input,select{width:100%;font-family:inherit;font-size:17px;padding:11px 12px;border:0;border-radius:10px;background:var(--fill);color:var(--text);outline:none;-webkit-appearance:none;appearance:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;background:var(--fill);color:var(--text);padding:8px 14px;border-radius:20px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:var(--blue);color:#fff}
.btn{width:100%;border:0;background:var(--blue);color:#fff;padding:14px;border-radius:12px;font-family:inherit;font-size:17px;font-weight:600;margin-top:16px;cursor:pointer}
.btn.sec{background:var(--fill);color:var(--blue);margin-top:8px}
.btn.danger{background:var(--fill);color:var(--red)}
.hint{font-size:13px;color:var(--sub);margin-top:8px}
.stakes{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:6px}
.stk{border:0;background:var(--fill);color:var(--text);border-radius:12px;padding:10px 4px;font-family:inherit;cursor:pointer;text-align:center}
.stk small{display:block;color:var(--sub);font-size:12px;font-weight:600}
.stk b{font-size:18px}
.stk.on{background:var(--blue);color:#fff}
.stk.on small{color:rgba(255,255,255,.8)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--card);border-radius:14px;padding:14px}
.kpi small{color:var(--sub);font-size:12px;display:block}
.kpi strong{font-size:22px;letter-spacing:-.5px}
.pos{color:var(--green)}.neg{color:var(--red)}
.bet{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.bet:first-child{border-top:0}
.bet .main{flex:1;min-width:0}
.bet .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bet .s{font-size:13px;color:var(--sub)}
.bet .p{font-weight:700;text-align:right;min-width:70px}
.bet select{width:auto;font-size:13px;font-weight:600;padding:6px 8px}
.x{border:0;background:none;color:var(--sub);font-size:20px;cursor:pointer;padding:4px}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.mrow:first-child{border-top:0}
svg{width:100%;height:auto;display:block}
.hide{display:none}
.empty{text-align:center;color:var(--sub);padding:20px}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Bet Tracker</h1>
  <div class="seg" id="tabs">
    <button data-t="bets" class="on">Scommesse</button>
    <button data-t="stats">Statistiche</button>
    <button data-t="set">Impostazioni</button>
  </div>
</div></header>

<div class="wrap">

<section id="tab-bets">
  <div class="card">
    <h2>Nuova scommessa</h2>
    <label>Chi scommette</label>
    <select id="fTipster"></select>
    <label>Stake sul tuo bankroll</label>
    <div class="stakes" id="stakeBox"></div>
    <div class="hint" id="stakeHint"></div>
    <div class="row2">
      <div><label>Quota</label><input id="fOdds" type="number" step="0.01" min="1.01" inputmode="decimal" placeholder="1.85"></div>
      <div><label>Importo giocato (€)</label><input id="fAmount" type="number" step="0.01" min="0" inputmode="decimal"></div>
    </div>
    <div class="row2">
      <div><label>Data</label><input id="fDate" type="date"></div>
      <div><label>Esito</label>
        <select id="fResult">
          <option value="pending">In corso</option>
          <option value="win">Vinta</option>
          <option value="loss">Persa</option>
          <option value="void">Rimborsata</option>
        </select></div>
    </div>
    <label>Nota (facoltativa)</label>
    <input id="fNote" type="text" placeholder="Es. Inter - Milan, Over 2.5">
    <div class="hint" id="calcLine"></div>
    <button class="btn" id="addBtn">Aggiungi</button>
  </div>

  <div class="card">
    <h2>Storico</h2>
    <div class="chips" id="listFilter" style="margin-bottom:8px"></div>
    <div id="betList"></div>
  </div>
</section>

<section id="tab-stats" class="hide">
  <div class="card" style="padding:12px"><div class="chips" id="statFilter"></div></div>
  <div class="kpis" id="kpis"></div>
  <div class="card"><h2>Risultato mensile (netto abbonamento)</h2><div id="chartMonth"></div></div>
  <div class="card"><h2>Andamento cumulato</h2><div id="chartCum"></div></div>
  <div class="card"><h2>Dettaglio mesi</h2><div id="monthTable"></div></div>
</section>

<section id="tab-set" class="hide">
  <div class="card">
    <h2>Bankroll e stake</h2>
    <label>Il tuo bankroll (€)</label>
    <input id="sBank" type="number" step="10" min="0" inputmode="decimal">
    <label>1 stake = quanto % del bankroll</label>
    <input id="sPct" type="number" step="0.1" min="0.1" max="100" inputmode="decimal">
    <label>Stake disponibili (separati da spazio, max 6)</label>
    <input id="sStakes" type="text" inputmode="decimal" placeholder="0,5 0,75 1">
    <div class="hint">Esempio: 0,5 0,75 1 oppure 0,25 0,5 1 1,5 2. Il bankroll è un solo valore, che aggiorni tu.</div>
  </div>
  <div class="card">
    <h2>Generale</h2>
    <label>Tipster predefinito nel form</label>
    <select id="sDef"></select>
    <label>Il tuo nome nell'app</label>
    <input id="sMe" type="text" maxlength="30">
  </div>
  <div class="card">
    <h2>Tipster e abbonamenti</h2>
    <div id="tipList"></div>
    <label>Aggiungi tipster</label>
    <div class="row2"><input id="newTip" type="text" placeholder="Nome"><input id="newTipSub" type="number" step="0.01" min="0" placeholder="€ / mese" inputmode="decimal"></div>
    <button class="btn sec" id="addTip">Aggiungi tipster</button>
  </div>
  <div class="card">
    <h2>Dati</h2>
    <button class="btn sec" id="exp" style="margin-top:0">Esporta backup (JSON)</button>
    <button class="btn sec" id="impBtn">Importa backup</button>
    <input type="file" id="impFile" accept=".json" class="hide">
    <button class="btn danger" id="wipe">Cancella tutto</button>
  </div>
</section>

</div>

<script>
const KEY='bettracker.v1';
const DEF_STAKES=[0.5,0.75,1];
let S=load();
let ui={tab:'bets',listF:'all',statF:'all'};

function load(){
  let d=null;
  try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  return normalize(d);
}
function normalize(d){
  if(!d||!d.bets)d={bets:[],tipsters:[{name:'GSC',sub:0}],subOv:{},set:{}};
  d.tipsters=(d.tipsters&&d.tipsters.length?d.tipsters:[{name:'GSC',sub:0}]).map(t=>({name:t.name,sub:t.sub||0}));
  d.subOv=d.subOv||{};
  const s=d.set||{};
  const stakes=Array.isArray(s.stakes)?s.stakes.filter(x=>x>0).slice(0,6):[];
  d.set={
    bank:s.bank>=0?s.bank:1000,
    stakePct:s.stakePct>0?s.stakePct:1,
    stakes:stakes.length?stakes:DEF_STAKES.slice(),
    defTipster:s.defTipster||'GSC',
    meName:(s.meName||'Io').trim()||'Io'
  };
  d.bets.forEach(b=>{if(b.tipster==='Io (manuale)')b.tipster=d.set.meName});
  return d;
}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
const $=s=>document.querySelector(s);
const eur=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n);
const sgn=n=>(n>0?'+':'')+eur(n);
const cls=n=>n>0?'pos':n<0?'neg':'';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const ym=d=>d.slice(0,7);
const mLabel=m=>{const[y,mo]=m.split('-');return['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'][+mo-1]+' '+y.slice(2)};
const fmtN=n=>String(n).replace('.',',');

const me=()=>S.set.meName;
function profit(b){
  if(b.result==='win')return b.amount*(b.odds-1);
  if(b.result==='loss')return -b.amount;
  return 0;
}
const settled=b=>b.result==='win'||b.result==='loss';
function names(){return[...S.tipsters.map(t=>t.name),me()]}
function subOf(t,m){
  if(t===me())return 0;
  const k=t+'|'+m;
  if(k in S.subOv)return S.subOv[k];
  const x=S.tipsters.find(z=>z.name===t);return x?x.sub:0;
}
function monthsRange(bets){
  const cur=ym(today());
  let first=bets.length?bets.map(b=>b.date).sort()[0].slice(0,7):cur;
  if(first>cur)first=cur;
  const out=[];let[y,m]=first.split('-').map(Number);
  const[cy,cm]=cur.split('-').map(Number);
  while(y<cy||(y===cy&&m<=cm)){out.push(y+'-'+String(m).padStart(2,'0'));m++;if(m>12){m=1;y++}}
  return out;
}
function monthly(filter){
  const tips=filter==='all'?names():[filter];
  const all=S.bets.filter(b=>filter==='all'||b.tipster===filter);
  return monthsRange(all).map(m=>{
    const bs=all.filter(b=>ym(b.date)===m);
    const gross=bs.reduce((a,b)=>a+profit(b),0);
    let sub=0;
    tips.forEach(t=>{
      if(t===me())return;
      const has=S.bets.some(b=>b.tipster===t&&ym(b.date)===m);
      const k=t+'|'+m;
      if(has||(k in S.subOv&&S.subOv[k]>0))sub+=subOf(t,m);
      else if(m===ym(today())&&S.bets.some(b=>b.tipster===t))sub+=subOf(t,m);
    });
    return{m,gross,sub,net:gross-sub,n:bs.length};
  });
}

/* ---------- Stake sul bankroll ---------- */
const stakeEur=s=>S.set.bank*S.set.stakePct/100*s;
function renderStakeBox(){
  const cur=parseFloat($('#fAmount').value);
  $('#stakeBox').innerHTML=S.set.stakes.map(s=>{
    const v=stakeEur(s);
    const on=Math.abs(v-cur)<0.005;
    return`<button class="stk ${on?'on':''}" data-s="${s}"><small>Stake ${fmtN(s)}</small><b>${eur(v)}</b></button>`;
  }).join('');
  $('#stakeHint').textContent=`Bankroll ${eur(S.set.bank)} · 1 stake = ${fmtN(S.set.stakePct)}% (${eur(stakeEur(1))}). Tocca uno stake per usarlo come importo.`;
}
$('#stakeBox').onclick=e=>{
  const b=e.target.closest('[data-s]');if(!b)return;
  $('#fAmount').value=stakeEur(parseFloat(b.dataset.s)).toFixed(2);
  syncAmount();
};

/* ---------- Form ---------- */
function fillTipsterSelects(){
  const list=names();
  const cur=$('#fTipster').value;
  $('#fTipster').innerHTML=list.map(n=>`<option>${esc(n)}</option>`).join('');
  const def=list.includes(S.set.defTipster)?S.set.defTipster:list[0];
  $('#fTipster').value=cur&&list.includes(cur)?cur:def;
}
function chipsFilter(el,key){
  if(ui[key]!=='all'&&!names().includes(ui[key]))ui[key]='all';
  const items=['all',...names()];
  el.innerHTML=items.map(n=>`<button class="chip ${ui[key]===n?'on':''}" data-f="${esc(n)}">${n==='all'?'Tutti':esc(n)}</button>`).join('');
  el.onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;ui[key]=b.dataset.f;renderAll()};
}
function syncAmount(){
  const o=parseFloat($('#fOdds').value),a=parseFloat($('#fAmount').value)||0;
  if(o>1&&a>0){
    $('#calcLine').innerHTML=`Se vinta: profitto <b class="pos">${eur(a*(o-1))}</b> (ritorno ${eur(a*o)}) · Se persa: <b class="neg">-${eur(a)}</b>`;
  }else $('#calcLine').textContent='Inserisci quota e importo per vedere vincita e profitto.';
  renderStakeBox();
}
$('#fAmount').oninput=syncAmount;
$('#fOdds').oninput=syncAmount;
$('#addBtn').onclick=()=>{
  const odds=parseFloat($('#fOdds').value),amount=parseFloat($('#fAmount').value);
  if(!(odds>1)){alert('Inserisci una quota valida (> 1).');return}
  if(!(amount>0)){alert('Inserisci un importo valido.');return}
  S.bets.push({id:Date.now()+''+Math.random().toString(36).slice(2,6),date:$('#fDate').value||today(),tipster:$('#fTipster').value,odds,amount,note:$('#fNote').value.trim(),result:$('#fResult').value});
  save();
  $('#fOdds').value='';$('#fAmount').value='';$('#fNote').value='';$('#fResult').value='pending';
  renderAll();
};

/* ---------- Lista ---------- */
function renderList(){
  chipsFilter($('#listFilter'),'listF');
  const l=S.bets.filter(b=>ui.listF==='all'||b.tipster===ui.listF).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  if(!l.length){$('#betList').innerHTML='<div class="empty">Nessuna scommessa registrata.</div>';return}
  $('#betList').innerHTML=l.map(b=>{
    const p=profit(b);
    const pTxt=b.result==='pending'?'<span style="color:var(--sub)">—</span>':b.result==='void'?'<span style="color:var(--sub)">0</span>':`<span class="${cls(p)}">${sgn(p)}</span>`;
    return`<div class="bet" data-id="${b.id}">
      <div class="main"><div class="t">${esc(b.tipster)}${b.note?' · '+esc(b.note):''}</div>
      <div class="s">${b.date.split('-').reverse().join('/')} · @${b.odds.toFixed(2)} · ${eur(b.amount)}</div></div>
      <select data-res>
        <option value="pending" ${b.result==='pending'?'selected':''}>In corso</option>
        <option value="win" ${b.result==='win'?'selected':''}>Vinta</option>
        <option value="loss" ${b.result==='loss'?'selected':''}>Persa</option>
        <option value="void" ${b.result==='void'?'selected':''}>Rimb.</option>
      </select>
      <div class="p">${pTxt}</div>
      <button class="x" data-del>×</button></div>`}).join('');
}
$('#betList').onchange=e=>{
  if(!e.target.matches('[data-res]'))return;
  const id=e.target.closest('.bet').dataset.id;
  S.bets.find(b=>b.id===id).result=e.target.value;save();renderAll();
};
$('#betList').onclick=e=>{
  if(!e.target.matches('[data-del]'))return;
  if(!confirm('Eliminare questa scommessa?'))return;
  const id=e.target.closest('.bet').dataset.id;
  S.bets=S.bets.filter(b=>b.id!==id);save();renderAll();
};

/* ---------- Grafici SVG ---------- */
function barChart(data){
  if(!data.length)return'<div class="empty">Nessun dato</div>';
  const W=600,H=240,pl=8,pr=8,pt=24,pb=30;
  const vals=data.map(d=>d.net);
  const max=Math.max(0,...vals),min=Math.min(0,...vals);
  const rng=(max-min)||1;
  const y=v=>pt+(max-v)/rng*(H-pt-pb);
  const step=(W-pl-pr)/data.length,bw=Math.min(46,step*0.62);
  let s=`<svg viewBox="0 0 ${W} ${H}"><line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`;
  data.forEach((d,i)=>{
    const x=pl+i*step+(step-bw)/2,y0=y(0),y1=y(d.net);
    const top=Math.min(y0,y1),h=Math.max(2,Math.abs(y1-y0));
    s+=`<rect x="${x}" y="${top}" width="${bw}" height="${h}" rx="6" fill="${d.net>=0?'var(--green)':'var(--red)'}"/>`;
    const ly=d.net>=0?top-6:top+h+14;
    s+=`<text x="${x+bw/2}" y="${ly}" font-size="11" text-anchor="middle" fill="var(--text)" font-weight="600">${Math.round(d.net)}</text>`;
    s+=`<text x="${x+bw/2}" y="${H-10}" font-size="11" text-anchor="middle" fill="var(--sub)">${mLabel(d.m)}</text>`;
  });
  return s+'</svg>';
}
function lineChart(pts){
  if(!pts.length)return'<div class="empty">Nessun dato</div>';
  const W=600,H=220,pl=14,pr=14,pt=22,pb=28;
  const vals=pts.map(p=>p.v);
  const all=[0,...vals],max=Math.max(...all),min=Math.min(...all),rng=(max-min)||1;
  const x=i=>pts.length===1?W/2:pl+i*(W-pl-pr)/(pts.length-1);
  const y=v=>pt+(max-v)/rng*(H-pt-pb);
  const path=vals.map((v,i)=>(i?'L':'M')+x(i)+' '+y(v)).join(' ');
  const last=vals[vals.length-1],col=last>=0?'var(--green)':'var(--red)';
  let s=`<svg viewBox="0 0 ${W} ${H}"><line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-dasharray="4 4"/>
  <path d="${path}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{s+=`<circle cx="${x(i)}" cy="${y(p.v)}" r="4" fill="${col}"/><text x="${x(i)}" y="${H-8}" font-size="11" text-anchor="middle" fill="var(--sub)">${mLabel(p.m)}</text>`});
  s+=`<text x="${x(pts.length-1)}" y="${y(last)-10}" font-size="12" text-anchor="end" font-weight="700" fill="${col}">${sgn(last)}</text>`;
  return s+'</svg>';
}

/* ---------- Statistiche ---------- */
function renderStats(){
  chipsFilter($('#statFilter'),'statF');
  const f=ui.statF,data=monthly(f);
  const bets=S.bets.filter(b=>f==='all'||b.tipster===f);
  const st=bets.filter(settled),w=st.filter(b=>b.result==='win').length;
  const gross=data.reduce((a,d)=>a+d.gross,0),sub=data.reduce((a,d)=>a+d.sub,0),net=gross-sub;
  const staked=st.reduce((a,b)=>a+b.amount,0);
  const roi=staked?gross/staked*100:0;
  const cm=data.find(d=>d.m===ym(today()));
  $('#kpis').innerHTML=[
    ['Netto totale',`<span class="${cls(net)}">${sgn(net)}</span>`],
    ['Mese corrente',cm?`<span class="${cls(cm.net)}">${sgn(cm.net)}</span>`:'—'],
    ['Profitto lordo',`<span class="${cls(gross)}">${sgn(gross)}</span>`],
    ['Abbonamenti',`<span class="neg">-${eur(sub)}</span>`],
    ['Win rate',st.length?(w/st.length*100).toFixed(1)+'%':'—'],
    ['ROI (lordo)',st.length?`<span class="${cls(roi)}">${roi.toFixed(1)}%</span>`:'—'],
  ].map(k=>`<div class="kpi"><small>${k[0]}</small><strong>${k[1]}</strong></div>`).join('');
  $('#chartMonth').innerHTML=barChart(data);
  let c=0;
  $('#chartCum').innerHTML=lineChart(data.map(d=>({m:d.m,v:(c+=d.net)})));
  $('#monthTable').innerHTML=[...data].reverse().map(d=>`<div class="mrow">
    <div><b>${mLabel(d.m)}</b><div style="font-size:12px;color:var(--sub)">${d.n} giocate · lordo ${sgn(d.gross)} · abb. -${eur(d.sub)}</div></div>
    <b class="${cls(d.net)}">${sgn(d.net)}</b></div>`).join('')||'<div class="empty">Nessun dato</div>';
}

/* ---------- Impostazioni ---------- */
function renameTipster(oldN,newN){
  S.bets.forEach(b=>{if(b.tipster===oldN)b.tipster=newN});
  Object.keys(S.subOv).forEach(k=>{
    if(k.startsWith(oldN+'|')){S.subOv[newN+'|'+k.slice(oldN.length+1)]=S.subOv[k];delete S.subOv[k]}
  });
  if(S.set.defTipster===oldN)S.set.defTipster=newN;
  if(ui.listF===oldN)ui.listF=newN;
  if(ui.statF===oldN)ui.statF=newN;
}
function nameFree(n,except){
  return n&&!names().some(x=>x.toLowerCase()===n.toLowerCase()&&x!==except);
}
function renderSettings(){
  $('#sBank').value=S.set.bank;
  $('#sPct').value=S.set.stakePct;
  $('#sStakes').value=S.set.stakes.map(fmtN).join(' ');
  $('#sMe').value=S.set.meName;
  const list=names();
  $('#sDef').innerHTML=list.map(n=>`<option>${esc(n)}</option>`).join('');
  $('#sDef').value=list.includes(S.set.defTipster)?S.set.defTipster:list[0];
  const cm=ym(today());
  $('#tipList').innerHTML=S.tipsters.length?S.tipsters.map((t,i)=>{
    const k=t.name+'|'+cm,ov=k in S.subOv?S.subOv[k]:'';
    return`<div style="padding:10px 0;border-top:${i?'1px solid var(--line)':'0'}">
      <div style="display:flex;gap:8px;align-items:center"><input type="text" data-name="${i}" value="${esc(t.name)}" maxlength="30" style="font-weight:600">
      <button class="x" data-rm="${i}">×</button></div>
      <div class="row2"><div><label>Abbonamento mensile (€)</label><input type="number" step="0.01" min="0" data-sub="${i}" value="${t.sub}" inputmode="decimal"></div>
      <div><label>Solo ${mLabel(cm)} (€)</label><input type="number" step="0.01" min="0" data-ov="${esc(t.name+'|'+cm)}" value="${ov}" placeholder="uguale" inputmode="decimal"></div></div></div>`}).join(''):'<div class="empty">Nessun tipster</div>';
}
$('#sBank').onchange=()=>{S.set.bank=Math.max(0,parseFloat($('#sBank').value)||0);save();renderAll()};
$('#sPct').onchange=()=>{S.set.stakePct=Math.min(100,Math.max(0.1,parseFloat($('#sPct').value)||1));save();renderAll()};
$('#sStakes').onchange=()=>{
  const v=$('#sStakes').value.split(/[\s;]+/).map(x=>parseFloat(x.replace(',','.'))).filter(x=>x>0).slice(0,6);
  if(v.length)S.set.stakes=v;
  save();renderAll();
};
$('#sDef').onchange=()=>{S.set.defTipster=$('#sDef').value;save();renderAll()};
$('#sMe').onchange=()=>{
  const n=$('#sMe').value.trim(),old=me();
  if(!nameFree(n,old)){alert('Nome vuoto o già usato.');renderAll();return}
  renameTipster(old,n);S.set.meName=n;save();renderAll();
};
$('#tipList').onchange=e=>{
  const t=e.target,v=parseFloat(t.value);
  if(t.dataset.name!==undefined){
    const i=+t.dataset.name,old=S.tipsters[i].name,n=t.value.trim();
    if(!nameFree(n,old)){alert('Nome vuoto o già usato.');renderAll();return}
    renameTipster(old,n);S.tipsters[i].name=n;
  }
  else if(t.dataset.sub!==undefined)S.tipsters[+t.dataset.sub].sub=Math.max(0,v||0);
  else if(t.dataset.ov!==undefined){
    if(t.value==='')delete S.subOv[t.dataset.ov];else S.subOv[t.dataset.ov]=Math.max(0,v||0);
  }
  save();renderAll();
};
$('#tipList').onclick=e=>{
  if(e.target.dataset.rm===undefined)return;
  const t=S.tipsters[+e.target.dataset.rm];
  if(S.bets.some(b=>b.tipster===t.name)){alert('Ci sono scommesse collegate a questo tipster: eliminale prima.');return}
  if(!confirm('Rimuovere '+t.name+'?'))return;
  S.tipsters.splice(+e.target.dataset.rm,1);save();renderAll();
};
$('#addTip').onclick=()=>{
  const n=$('#newTip').value.trim();
  if(!nameFree(n,null)){alert('Nome vuoto o già esistente.');return}
  S.tipsters.push({name:n,sub:Math.max(0,parseFloat($('#newTipSub').value)||0)});
  $('#newTip').value='';$('#newTipSub').value='';save();renderAll();
};
$('#exp').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));
  a.download='bet-tracker-backup-'+today()+'.json';a.click();
};
$('#impBtn').onclick=()=>$('#impFile').click();
$('#impFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.bets||!d.tipsters)throw 0;S=normalize(d);save();renderAll();alert('Importato.')}catch(x){alert('File non valido.')}};
  r.readAsText(f);
};
$('#wipe').onclick=()=>{
  if(confirm('Cancellare TUTTI i dati?')){localStorage.removeItem(KEY);S=load();renderAll()}
};

/* ---------- Tab & init ---------- */
$('#tabs').onclick=e=>{
  const b=e.target.closest('[data-t]');if(!b)return;
  ui.tab=b.dataset.t;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  ['bets','stats','set'].forEach(t=>$('#tab-'+t).classList.toggle('hide',t!==ui.tab));
  window.scrollTo(0,0);renderAll();
};
function renderAll(){
  fillTipsterSelects();
  if(ui.tab==='bets'){syncAmount();renderList()}
  if(ui.tab==='stats')renderStats();
  if(ui.tab==='set')renderSettings();
}
$('#fDate').value=today();
renderAll();
</script>
</body>
</html>
